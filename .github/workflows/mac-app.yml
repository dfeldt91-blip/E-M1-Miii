name: Mac app

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub Release with this tag (e.g. mod-builder-1.0); empty = just build"
        required: false
        default: ""
  push:
    paths:
      - "builder/**"
      - "tools/modcore.py"
      - "tools/olyfw.py"
      - "tools/olycompress.py"
      - "tools/patch_frame_white.py"
      - "tools/patch_xpan_icon.py"
      - "tools/patch_underwater_mono.py"
      - "tools/patch_looks.py"
      - "tools/looks_library.py"
      - ".github/workflows/mac-app.yml"

jobs:
  mac-app:
    # one architecture failing (e.g. no free runner) must not block the other or the release
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15          # Apple silicon (2026-11-16: macos-latest arm64 had no free runners, macos-14 retired)
            arch: apple-silicon
          - runner: macos-15-intel    # Intel Macs
            arch: intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the app
        run: bash builder/mac/build_app.sh
      - name: Check that the app starts its command-line mode
        run: |
          "dist/E-M1 III Mod Builder.app/Contents/MacOS/E-M1 III Mod Builder" --list
      - uses: actions/upload-artifact@v4
        with:
          name: E-M1-III-Mod-Builder-mac-${{ matrix.arch }}
          path: dist/E-M1-III-Mod-Builder-mac.zip
          if-no-files-found: error

  release:
    # A manual run with release_tag set publishes both app zips as a GitHub Release
    # (the release action creates the tag on the commit that was built).
    if: always() && github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: mac-app
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Name the files
        run: |
          mkdir out
          for a in apple-silicon intel; do
            f=artifacts/E-M1-III-Mod-Builder-mac-$a/E-M1-III-Mod-Builder-mac.zip
            if [ -f "$f" ]; then cp "$f" out/E-M1-III-Mod-Builder-mac-$a.zip; else echo "no $a build"; fi
          done
          ls -la out
          ls out/*.zip >/dev/null
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: E-M1 III Mod Builder ${{ inputs.release_tag }}
          files: out/*.zip
          body: |
            Mac app that downloads the official E-M1 Mark III firmware 1.6 from OM, lets you pick mods and writes E1399999.BIN.

            **Download:** `E-M1-III-Mod-Builder-mac-apple-silicon.zip` for M1/M2/M3/M4 Macs, `E-M1-III-Mod-Builder-mac-intel.zip` for Intel Macs. If only the Intel file is listed, it also runs on M1-M4 Macs (macOS installs Rosetta when asked).

            **First start:** the app is not signed by Apple. Right-click it, choose Open, then Open again. If macOS still blocks it: System Settings, Privacy & Security, Open Anyway.

            Unofficial. Flashing modified firmware is at your own risk. Instructions: builder/README.md.
